name: Production Acceptance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caiae-production-acceptance
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require configured production monitoring
        env:
          CAIAE_MONITOR_ENABLED: ${{ vars.CAIAE_MONITOR_ENABLED }}
          CAIAE_MONITOR_API_URL: ${{ vars.CAIAE_MONITOR_API_URL }}
          ENGINE_ROOM_BASE_URL: ${{ vars.ENGINE_ROOM_BASE_URL }}
        run: |
          if [ "$CAIAE_MONITOR_ENABLED" != "true" ] || [ -z "$CAIAE_MONITOR_API_URL" ] || [ -z "$ENGINE_ROOM_BASE_URL" ]; then
            echo "Production telemetry is not enabled/configured; acceptance must fail closed"
            exit 1
          fi
      - name: Authenticated live API, schema and exact release verification
        env:
          CAIAE_SMOKE_API_URL: ${{ vars.CAIAE_MONITOR_API_URL }}
          CAIAE_SMOKE_OPERATOR_TOKEN: ${{ secrets.CAIAE_SMOKE_OPERATOR_TOKEN }}
          CAIAE_SMOKE_EXPECTED_RELEASE: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs --require-auth
      - name: All six worker sweeps healthy and Engine Room telemetry accepted
        env:
          CAIAE_MONITOR_API_URL: ${{ vars.CAIAE_MONITOR_API_URL }}
          ENGINE_ROOM_BASE_URL: ${{ vars.ENGINE_ROOM_BASE_URL }}
          ENGINE_ROOM_TELEMETRY_KEY_ID: ${{ secrets.ENGINE_ROOM_TELEMETRY_KEY_ID }}
          ENGINE_ROOM_TELEMETRY_SECRET: ${{ secrets.ENGINE_ROOM_TELEMETRY_SECRET }}
        run: node scripts/engine-room-monitor.mjs
